name: Spring PetClinic CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw clean verify "-Duser.timezone=Asia/Kolkata"

      - name: SonarQube Analysis
        run: ./mvnw sonar:sonar -Dsonar.projectKey=spring-petclinic -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.qualitygate.wait=true

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload JAR to Nexus
        run: |
          ./mvnw deploy:deploy-file \
            "-Dfile=target/spring-petclinic-4.0.0-SNAPSHOT.jar" \
            "-DgroupId=org.springframework.samples" \
            "-DartifactId=spring-petclinic" \
            "-Dversion=4.0.0-SNAPSHOT" \
            "-Dpackaging=jar" \
            "-DrepositoryId=nexus" \
            "-Durl=${{ secrets.NEXUS_URL }}" \
            "-Dusername=${{ secrets.NEXUS_USERNAME }}" \
            "-Dpassword=${{ secrets.NEXUS_PASSWORD }}"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:latest \
            .

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}
            sudo docker stop petclinic || true
            sudo docker rm petclinic || true
            sudo docker run -d \
              --name petclinic \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

      - name: Health Check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 20
            curl --fail http://localhost:8080/

       